name: Train DanceMatch baseline

on:
  push:
    branches: [feature/dance-style-training]
    paths:
      - "training/**"
      - ".github/workflows/train-dance-baseline.yml"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Optional smoke test row limit (0 = all)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dance-style-training
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          pip install -r training/requirements.txt
      - name: Run labeled-data baseline
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          cd training
          python train_baseline.py --dataset Yi3852/MuCUE --config ballroom_genres --max-items "${{ inputs.max_items || '0' }}" --out artifacts
      - name: Upload evaluation and model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dancematch-training-results
          path: training/artifacts/
          if-no-files-found: warn
          retention-days: 14
